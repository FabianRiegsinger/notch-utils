name: CI

# Every push builds all three platforms. Pushing a tag vX.Y.Z (scripts/release.sh) also
# publishes a GitHub Release with the packages attached.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: notch-utils-macos-arm64
            package: notch-utils-macos.zip
          - os: windows-latest
            artifact: notch-utils-windows-x64
            package: notch-utils-windows-x64.zip
          - os: ubuntu-latest
            artifact: notch-utils-linux-x64
            package: notch-utils-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml has $v"; exit 1; }
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/notch-utils && cp target/release/notch-utils assets/notch-utils.desktop assets/appicon/icon-1024.png pkg/notch-utils/
          tar -C pkg -czf target/release/notch-utils-linux-x64.tar.gz notch-utils
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/notch-utils.exe -DestinationPath target/release/notch-utils-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.package }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Name packages after the version
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir out
          mv dist/notch-utils-macos-arm64/notch-utils-macos.zip "out/notch-utils-$v-macos-arm64.zip"
          mv dist/notch-utils-windows-x64/notch-utils-windows-x64.zip "out/notch-utils-$v-windows-x64.zip"
          mv dist/notch-utils-linux-x64/notch-utils-linux-x64.tar.gz "out/notch-utils-$v-linux-x64.tar.gz"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.2.0-beta.1) become pre-releases.
          pre=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "notch-utils ${GITHUB_REF_NAME#v}" --generate-notes $pre
