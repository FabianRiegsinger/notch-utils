[package]
name = "notch-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
auto-launch = "0.6.0"
base64 = "0.23.1"
chrono = "0.4"
chrono-tz = "0.10"
clipboard-rs = "0.3.5"
directories = "6.0.0"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
interprocess = "2.4.7"
jiff = "0.2.38"
log = "0.4.35"
notify = "8"
rrule = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-path", "system-tray", "unstable-winit-030"] }
starship-battery = "0.12.0"
sysinfo = "0.40.1"
toml = "1.1.8"
ureq = "3"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# Vendored crates, each with one marked fix.
# winit 0.30.13 with one fix: don't abort on incomplete KVO change dictionaries (macOS).
# See vendor/winit/src/platform_impl/macos/window_delegate.rs ("notch-utils patch").
[patch.crates-io]
winit = { path = "vendor/winit" }
# softbuffer 0.4.8 with one fix: keep the alpha channel on macOS (transparent software-rendered
# windows). See vendor/softbuffer/src/backends/cg.rs ("notch-utils patch").
softbuffer = { path = "vendor/softbuffer" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_System_Variant", "Win32_System_WinRT"] }
windows-core = "0.62"
