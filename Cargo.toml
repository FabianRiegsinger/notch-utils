[package]
name = "notch-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software", "system-tray", "unstable-winit-030"] }
toml = "1.1.8"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
