[package]
name = "notch-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clipboard-rs = "0.3.5"
directories = "6.0.0"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
interprocess = "2.4.7"
jiff = "0.2.38"
log = "0.4.35"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software", "system-tray", "unstable-winit-030"] }
starship-battery = "0.12.0"
sysinfo = "0.40.1"
toml = "1.1.8"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# winit 0.30.13 with one fix: don't abort on incomplete KVO change dictionaries (macOS).
# See vendor/winit/src/platform_impl/macos/window_delegate.rs ("notch-utils patch").
[patch.crates-io]
winit = { path = "vendor/winit" }
